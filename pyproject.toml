[project]
name = "webcap"
version = "0.1.104"
description = "An ultra-lightweight web screenshot tool written in Python"
authors = [{name = "TheTechromancer"}]
license = "GPL-3.0"
readme = "README.md"
requires-python = ">=3.9,<3.14"
keywords = ["python", "cli", "web", "screenshot", "osint", "ocr", "bug-bounty", "bugbounty", "headless", "web-browser", "scanner", "python-library", "hacking", "pentesting", "recon"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28.0,<0.29",
    "websockets>=14.1,<16.0",
    "orjson>=3.10.12,<4",
    "uvloop>=0.21.0,<0.22",
    "fastapi>=0.115.6,<0.116",
    "uvicorn>=0.34.0,<0.35",
    "rich>=13.9.4,<15.0.0",
    "extractous>=0.3.0,<0.4",
    "pillow>=11.1.0,<12",
    "numpy>=2.0.2,<2.1.0",
    "typer>=0.15.2,<0.16",
]

[project.urls]
Repository = "https://github.com/blacklanternsecurity/webcap"
Homepage = "https://github.com/blacklanternsecurity/webcap"

[project.scripts]
webcap = "webcap.cli:main"

[dependency-groups]
dev = [
    "ruff==0.11.10",
    "pytest-httpserver>=1.1.0,<2",
    "pytest-asyncio>=0.25.2,<0.26",
    "pytest-cov>=6.0.0,<7",
    "lxml>=5.3.0,<6",
]

[tool.ruff]
line-length = 119
lint.ignore = ["E402", "E721", "E741", "F401", "F403", "F405", "E713"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
